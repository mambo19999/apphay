<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hay Day Master - Dual Grid Live</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #090503;
            --card-bg: linear-gradient(135deg, #2c1a0e 0%, #150a04 100%);
            --card-border: #704214;
            --accent-gold: #f39c12;
            --accent-green: #2ecc71;
            --accent-orange: #e67e22;
            --accent-blue: #3498db;
            --text-main: #fff3e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% -20%, #3a1d10 0%, #090503 80%);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 6px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header ultra compatto */
        .header {
            text-align: center;
            padding: 6px;
            background: linear-gradient(135deg, #3d2817 0%, #150a04 100%);
            border: 2px solid var(--accent-gold);
            border-radius: 10px;
            margin-bottom: 8px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.7);
            animation: headerGlow 3s ease-in-out infinite alternate;
        }

        .header h1 {
            font-size: 14px;
            font-weight: 900;
            color: var(--accent-gold);
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 8px;
            color: #bcaaa4;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* Griglia principale a 2 colonne perfette: Sinistra Istanza 1, Destra Istanza 2 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .instance-column {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* Header colonna istanza */
        .column-header {
            font-size: 10px;
            font-weight: 900;
            background: rgba(243, 156, 18, 0.15);
            border: 1px solid rgba(243, 156, 18, 0.4);
            color: var(--accent-gold);
            padding: 5px 4px;
            border-radius: 6px;
            text-align: center;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .column-header.inst2 {
            color: #3498db;
            background: rgba(52, 152, 219, 0.15);
            border-color: rgba(52, 152, 219, 0.4);
        }

        .gear-icon {
            display: inline-block;
            animation: spinGear 6s linear infinite;
        }

        /* Mini Card Compatta Animata */
        .mini-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 5px 6px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        .mini-card:active {
            transform: scale(0.97);
        }

        .mini-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .mini-icon {
            font-size: 14px;
            animation: floatIcon 3s ease-in-out infinite alternate;
        }

        .mini-title {
            font-size: 10px;
            font-weight: 800;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            margin-left: 4px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #f39c12;
            box-shadow: 0 0 5px #f39c12;
            animation: pulseDot 1.5s infinite;
        }

        .status-dot.active { background: #2ecc71; box-shadow: 0 0 5px #2ecc71; }
        .status-dot.idle { background: #95a5a6; box-shadow: none; animation: none; }

        /* Pulsante super compatto */
        .btn-mini {
            width: 100%;
            border: none;
            padding: 3px;
            border-radius: 5px;
            font-size: 8px;
            font-weight: 900;
            color: #fff;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 2px 0 rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        .btn-mini:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .btn-orange { background: linear-gradient(180deg, #f39c12 0%, #d35400 100%); }
        .btn-green { background: linear-gradient(180deg, #2ecc71 0%, #27ae60 100%); }
        .btn-blue { background: linear-gradient(180deg, #3498db 0%, #2980b9 100%); }

        /* Toast Notifica */
        #toast {
            visibility: hidden;
            min-width: 180px;
            background: linear-gradient(135deg, #f39c12, #c0392b);
            color: #fff;
            text-align: center;
            border-radius: 10px;
            padding: 8px;
            position: fixed;
            z-index: 100;
            left: 50%;
            bottom: -40px;
            transform: translateX(-50%);
            font-weight: 900;
            font-size: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.8);
            transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            opacity: 0;
        }

        #toast.show {
            visibility: visible;
            bottom: 15px;
            opacity: 1;
        }

        @keyframes spinGear {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes floatIcon {
            0% { transform: translateY(0); }
            100% { transform: translateY(-2px); }
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.6; }
        }

        @keyframes headerGlow {
            0% { border-color: #f39c12; box-shadow: 0 3px 12px rgba(0,0,0,0.7); }
            100% { border-color: #f1c40f; box-shadow: 0 3px 15px rgba(243, 156, 18, 0.4); }
        }
    </style>
</head>
<body>

            <div class="mini-card">

                    <div class="status-dot"></div>
                </div>
                <button class="btn-mini btn-orange" onclick="azione('I2 - Impastatrice', 'Prepara')">Prepara</button>

            <div class="mini-card">

                    <span class="mini-icon">🥖</span>
                    <span class="mini-title">Forno</span>
                    <div class="status-dot active"></div>
                </div>
                <button class="btn-mini btn-green" onclick="azione('I2 - Forno', 'Raccogli')">Raccogli</button>
            </div>

            <div class="mini-card">

                    <span class="mini-icon">🥧</span>
                    <span class="mini-title">Pasticceria</span>
                    <div class="status-dot"></div>
                </div>
                <button class="btn-mini btn-orange" onclick="azione('I2 - Pasticceria', 'Prepara')">Prepara</button>
            </div>

            <div class="mini-card">
                <div class="mini-card-top">
                    <span class="mini-icon">🍝</span>
                    <span class="mini-title">Macchina Pasta</span>
                    <div class="status-dot"></div>
                </div>
                <button class="btn-mini btn-orange" onclick="azione('I2 - Pasta', 'Cerca')">Cerca</button>
            </div>

            <div class="mini-card">
                <div class="mini-card-top">
                    <span class="mini-icon">🧀</span>

                </div>
                <button class="btn-mini btn-blue" onclick="azione('I2 - Caseificio', 'Avvia')">Avvia</button>

            <div class="mini-card">

                </div>

    </div>

    <div id="toast">Comando inviato!</div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { tg.ready(); tg.expand(); }

        function azione(struttura, tipo) {
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
            mostraToast(struttura + ": " + tipo);
        }

        function mostraToast(msg) {
            const t = document.getElementById("toast");
            t.innerText = msg;
            t.className = "show";
            if (window.tTimeout) clearTimeout(window.tTimeout);
            window.tTimeout = setTimeout(() => { t.className = ""; }, 1500);
        }
    </script>
</body>
</html>
