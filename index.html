<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Per la mia Michi ❤️</title>
    <style>
        body {
            background: radial-gradient(circle, #2b0514, #0d0206);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: white;
            text-align: center;
            position: relative;
        }

        /* Testi fluttuanti sullo sfondo */
        .floating-text {
            position: absolute;
            color: rgba(255, 105, 180, 0.15);
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            white-space: nowrap;
            animation: moveRandom 15s linear infinite;
        }

        @keyframes moveRandom {
            0% { transform: translateY(110vh) translateX(-50px) rotate(0deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) translateX(50px) rotate(20deg); opacity: 0; }
        }

        /* Card centrale */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 105, 180, 0.3);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 0 50px rgba(255, 20, 147, 0.4);
            max-width: 450px;
            width: 90%;
            z-index: 10;
            animation: pulseCard 3s ease-in-out infinite;
        }

        @keyframes pulseCard {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(255, 20, 147, 0.3); }
            50% { transform: scale(1.02); box-shadow: 0 0 60px rgba(255, 20, 147, 0.6); }
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff758c, #ff7eb3, #ff416c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 117, 140, 0.5);
        }

        p {
            font-size: 18px;
            color: #ffd1dc;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Pulsanti */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 60px;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #siBtn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
        }
        #siBtn:hover {
            transform: scale(1.15);
            box-shadow: 0 0 25px rgba(255, 65, 108, 0.8);
        }

        #noBtn {
            background-color: #4a4a4a;
            color: #bbb;
            position: absolute;
        }

        #message {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
            color: #ff9a9e;
            min-height: 40px;
            text-shadow: 0 0 10px rgba(255, 154, 158, 0.5);
        }

        /* Cuori ed elementi festosi */
        .heart {
            position: absolute;
            color: #ff3366;
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            animation: flyUp 4s linear infinite;
            z-index: 1;
        }

        @keyframes flyUp {
            0% { transform: translateY(105vh) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Generatore automatico di sfondi romantici -->
    <script>
        const frasiSfondo = [
            "Ti amo Michi ❤️", "Mi manchi tantissimo ✨", "Sei bellissima 😍", 
            "Sei il mio battito 💓", "Meravigliosa ✨", "Sei tutto per me 🌹", 
            "I tuoi occhi 😍", "La mia vita 💖", "Ti amo da impazzire 💕"
        ];

        for (let i = 0; i < 25; i++) {
            const div = document.createElement('div');
            div.classList.add('floating-text');
            div.innerText = frasiSfondo[Math.floor(Math.random() * frasiSfondo.length)];
            div.style.left = Math.random() * 100 + 'vw';
            div.style.animationDuration = (Math.random() * 10 + 8) + 's';
            div.style.animationDelay = (Math.random() * 5) + 's';
            div.style.fontSize = (Math.random() * 15 + 16) + 'px';
            document.body.appendChild(div);
        }
    </script>

    <div class="card">
        <h1>Per la mia Michi ❤️</h1>
        <p>Una domanda fondamentale per la ragazza più spettacolare, dolce e bella dell'universo...<br><b>Mi ami vero?</b></p>
        
        <div class="btn-container">
            <button id="siBtn" onclick="haDettoSi()">Sì, immensamente! 🥰</button>
            <button id="noBtn" onmouseover="muoviNo()" onclick="muoviNo()">No 🙈</button>
        </div>
        
        <div id="message"></div>
    </div>

    <script>
        const complimenti = [
            "Ti amo da morire Michi! ❤️",
            "Sei la cosa più bella che mi sia mai capita! ✨",
            "Mi manchi ogni singolo secondo! 🥺",
            "Hai un sorriso che illumina tutto il mondo! 😍",
            "Sei pazzamente stupenda! 💖",
            "Il mio cuore batte solo per te! 💓",
            "Sei la mia favola preferita! 🌹"
        ];

        function muoviNo() {
            const btnNo = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 100);
            btnNo.style.position = 'fixed';
            btnNo.style.left = x + 'px';
            btnNo.style.top = y + 'px';
        }

        function haDettoSi() {
            const msgBox = document.getElementById('message');
            document.getElementById('noBtn').style.display = 'none';
            document.getElementById('siBtn').style.transform = 'scale(1.2)';
            
            // Effetto sequenza complimenti magica
            let index = 0;
            msgBox.innerHTML = complimenti[0];
            setInterval(() => {
                index = (index + 1) % complimenti.length;
                msgBox.innerHTML = complimenti[index];
            }, 2500);

            // Scatena pioggia massiccia di cuori
            for(let i = 0; i < 50; i++) {
                creaCuoreFesta();
            }
        }

        function creaCuoreFesta() {
            const cuore = document.createElement('div');
            cuore.classList.add('heart');
            cuore.innerHTML = ['❤️', '💖', '💘', '✨', '🌹', '💕'][Math.floor(Math.random() * 6)];
            cuore.style.left = Math.random() * window.innerWidth + 'px';
            cuore.style.animationDuration = (Math.random() * 3 + 2) + 's';
            cuore.style.fontSize = (Math.random() * 20 + 20) + 'px';
            document.body.appendChild(cuore);
            
            setTimeout(() => {
                cuore.remove();
            }, 5000);
        }

        // Generazione continua di cuoricini di sottofondo
        setInterval(creaCuoreFesta, 300);
    </script>

</body>
</html>
